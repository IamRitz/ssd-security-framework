# EXAMPLE CALLER — PR phase for a repo that ships a container image to ECR and
# lets the framework gate its deploy.
#
# This file proves the PR-phase controls: source security and the PRE-PUSH image
# scan. The registry scan, the artifact gate and the deploy are proven by
# deploy.yml, on the delivery run. Neither file claims the other's controls.
#
# Copy this to .github/workflows/security.yml in the consumer repo and change:
#   - the image name in `container-build`
#   - `semgrep_configs` to your language pack
#   - `@v1` if you pin a different framework version
#
# TRIGGER OWNERSHIP: this file owns `pull_request` and `schedule`; deploy.yml
# owns `push` to main and `workflow_dispatch`. Neither reacts to the other's
# events, so the scanners run exactly once per event.
#
# SECURITY: keep this `pull_request` — never `pull_request_target`. The notifier
# holds `pull-requests: write`; on `pull_request` GitHub forces the token
# read-only for fork PRs, so untrusted fork code cannot write a comment or read
# the Slack URL.
name: Security checks

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  source-security:
    # NEVER change this to `secrets: inherit` — that would hand every repo secret
    # to the scanning jobs.
    #
    # `_source-scan.yml` is OIDC-free: this job is NOT granted `id-token`. With
    # `break_glass_transport: lambda` it performs no break-glass itself; an
    # eligible, enforced BLOCK is DELEGATED to the `break-glass` job below
    # (output `break_glass_delegated`), which alone holds OIDC.
    uses: IamRitz/ssd-security-framework/.github/workflows/_source-scan.yml@v1
    permissions:
      contents: read
      pull-requests: write
    # The webhook URL is a credential: pass it as a declared SECRET (never a
    # repository variable, never `secrets: inherit`). Only the notifier step reads it.
    secrets:
      slack_notify_webhook: ${{ secrets.SECURITY_NOTIFY_SLACK_URL }}
    with:
      # toolkit_ref MUST match the @v1 above. See docs/versioning.md.
      toolkit_ref: v1
      gate_mode: ${{ vars.GATE_MODE || 'enforce' }}
      semgrep_configs: |
        p/owasp-top-ten
        p/javascript
      # `.` = the whole repository. Narrowing puts everything else OUTSIDE SAST, and
      # without a .semgrepignore Semgrep silently skips tests/, build/, vendor/ … too.
      semgrep_paths: .
      break_glass_enabled: true
      break_glass_transport: lambda

  break-glass:
    # THE ONLY JOB IN THIS FILE GRANTED `id-token: write`.
    #
    # It runs only when the source workflow actually delegated an eligible,
    # trusted, enforced BLOCK — never for a PASS, a hard block, or an integrity
    # failure. That output is only a cheap pre-filter: the called workflow
    # re-validates this run's own gate evidence (eligibility, run binding, gate
    # digest, synthetic route) BEFORE it assumes any AWS role, and executes no
    # code from this repository.
    needs: source-security
    if: ${{ always() && needs.source-security.outputs.break_glass_delegated == 'true' }}
    uses: IamRitz/ssd-security-framework/.github/workflows/_break-glass-lambda.yml@v1
    permissions:
      contents: read
      id-token: write
    # The source workflow always sends its own BLOCK alert; this adds one if the
    # approval request could not be delivered. The webhook URL is a credential:
    # it travels as a declared SECRET reaching the notifier step only.
    secrets:
      slack_notify_webhook: ${{ secrets.SECURITY_NOTIFY_SLACK_URL }}
    with:
      toolkit_ref: v1
      gate_mode: ${{ needs.source-security.outputs.gate_mode }}
      expected_gate_digest: ${{ needs.source-security.outputs.gate_digest }}
      lambda_function: ${{ vars.BREAK_GLASS_LAMBDA_FUNCTION }}
      lambda_role_arn: ${{ vars.BREAK_GLASS_LAMBDA_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION }}

  container-build:
    # Repo-specific: the consumer owns its own build. Holds ZERO cloud
    # credentials — it builds the image and uploads it as a tarball artifact.
    name: Container build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build without AWS credentials
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: your-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export image tarball
        run: docker save -o application-image.tar "your-app:$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-image-${{ github.sha }}
          path: application-image.tar
          if-no-files-found: error
          retention-days: 1

  image-security:
    needs: container-build
    if: github.event_name != 'schedule'
    uses: IamRitz/ssd-security-framework/.github/workflows/_image-scan-prepush.yml@v1
    permissions:
      contents: read
      pull-requests: write
    # The webhook URL is a credential: pass it as a declared SECRET (never a
    # repository variable, never `secrets: inherit`). Only the notifier step reads it.
    secrets:
      slack_notify_webhook: ${{ secrets.SECURITY_NOTIFY_SLACK_URL }}
    with:
      toolkit_ref: v1
      image_artifact: application-image-${{ github.sha }}
      gate_mode: ${{ vars.GATE_MODE || 'enforce' }}

  security-gate:
    # THE stable required check for branch protection, and it must represent
    # EVERY control that gates this PR — not just source security.
    #
    # For a container repository that means source security AND the pre-push
    # image gate. A rule requiring a source-only check would let a PR whose image
    # gate reported BLOCK_DEPLOY merge, which is not what the name promises.
    #
    # The name is a CONSTANT. Branch protection matches by exact string, so a
    # name computed from the gate mode would stop matching in one mode and the
    # rule would silently protect nothing.
    name: security-gate
    needs:
      - source-security
      - image-security
      - break-glass
    # `always()` so this job still REPORTS when a dependency fails or is skipped.
    # Without it the job is skipped, the required check never posts, and the PR
    # waits forever on a status that will not arrive.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # pass | overridden-block | block, and `approved` for a verified Lambda
      # break-glass override. Conformance reads these; the source verdict stays BLOCK.
      source_outcome: ${{ steps.gate.outputs.source_outcome }}
      source_override: ${{ steps.gate.outputs.source_override }}
    steps:
      - name: Check out the security framework toolkit
        # Only for security/scripts/final-gate.mjs: the override decision is a
        # framework-owned, tested conjunction, not hand-written shell per repo.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IamRitz/ssd-security-framework
          ref: v1
          path: .ssd-toolkit
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Require every security control that gates this pull request
        id: gate
        env:
          SSD_TOOLKIT: ${{ github.workspace }}/.ssd-toolkit/security
          EVENT: ${{ github.event_name }}
          SOURCE_RESULT: ${{ needs.source-security.result }}
          IMAGE_RESULT: ${{ needs.image-security.result }}
          SOURCE_VERDICT: ${{ needs.source-security.outputs.verdict }}
          IMAGE_VERDICT: ${{ needs.image-security.outputs.verdict }}
          SOURCE_MODE: ${{ needs.source-security.outputs.gate_mode }}
          IMAGE_MODE: ${{ needs.image-security.outputs.gate_mode }}
          # Every further fact the source-leg decision needs (final-gate.mjs also
          # reads SOURCE_RESULT and SOURCE_VERDICT above). Empty = missing = BLOCK.
          SOURCE_GATE_MODE: ${{ needs.source-security.outputs.gate_mode }}
          SOURCE_INTEGRITY_TRUSTED: ${{ needs.source-security.outputs.integrity_trusted }}
          SOURCE_BREAK_GLASS_ELIGIBLE: ${{ needs.source-security.outputs.break_glass_eligible }}
          SOURCE_BREAK_GLASS_DELEGATED: ${{ needs.source-security.outputs.break_glass_delegated }}
          SOURCE_SECRET_SCAN_RESULT: ${{ needs.source-security.outputs.secret_scan_result }}
          SOURCE_DEPENDENCY_SCAN_RESULT: ${{ needs.source-security.outputs.dependency_scan_result }}
          SOURCE_SAST_RESULT: ${{ needs.source-security.outputs.sast_result }}
          SOURCE_GATE_DIGEST: ${{ needs.source-security.outputs.gate_digest }}
          BREAK_GLASS_RESULT: ${{ needs.break-glass.result }}
          BREAK_GLASS_DECISION: ${{ needs.break-glass.outputs.decision_status }}
          BREAK_GLASS_REQUEST_DELIVERED: ${{ needs.break-glass.outputs.request_delivered }}
          BREAK_GLASS_GATE_DIGEST: ${{ needs.break-glass.outputs.gate_digest }}
        run: |
          set -euo pipefail
          echo "event=$EVENT"
          echo "source-security: result=$SOURCE_RESULT verdict=${SOURCE_VERDICT:-unknown}"
          echo "image-security:  result=$IMAGE_RESULT verdict=${IMAGE_VERDICT:-unknown}"

          failed=0
          # The source leg: pass | overridden-block | block. A source FAILURE
          # becomes an overridden BLOCK only with every fact final-gate.mjs
          # requires (eligible trusted policy BLOCK, clean scanner results, an
          # approved decision bound to this exact gate digest). Anything else,
          # including a scanner crash or a hard block, stays failed.
          if ! node "$SSD_TOOLKIT/scripts/final-gate.mjs"; then
            failed=1
          fi

          # The scheduled sweep deliberately builds no image, so `skipped` is
          # legitimate THERE and only there. On a pull request a skipped image
          # gate means a control that should have run did not — which must fail,
          # or schedule-shaped skipping would quietly redefine the PR contract.
          if [ "$EVENT" = "schedule" ]; then
            case "$IMAGE_RESULT" in
              success|skipped) ;;
              *)
                echo "::error::image security did not pass (result=$IMAGE_RESULT)"
                failed=1
                ;;
            esac
          elif [ "$IMAGE_RESULT" != "success" ]; then
            echo "::error::image security did not pass (result=$IMAGE_RESULT); a container PR is gated on it"
            failed=1
          fi

          # Verdict-specific log-only reporting, per control: only a blocking
          # verdict is suppressed by log-only. A PASS/DEPLOY has nothing to
          # suppress, but log-only stays visible as a rollout mode.
          report_log_only() {
            local control="$1" mode="$2" verdict="$3" blocking="$4"
            [ "$mode" = "log-only" ] || return 0
            if [ "$verdict" = "$blocking" ]; then
              echo "::warning::GREEN BY CONFIGURATION, not by verdict — $control verdict $verdict is reported but NOT enforced because gate_mode is log-only."
            elif [ -n "$verdict" ]; then
              echo "::warning::$control verdict $verdict. gate_mode is log-only; no blocking verdict exists, so nothing was suppressed. A future $blocking would not fail this check until the repository moves to enforce."
            else
              echo "::warning::$control verdict is unavailable, and gate_mode is log-only so nothing is enforced. Treat it as UNKNOWN, not clean."
            fi
          }
          report_log_only "source" "$SOURCE_MODE" "$SOURCE_VERDICT" BLOCK
          if [ "$IMAGE_RESULT" != "skipped" ]; then
            report_log_only "image" "$IMAGE_MODE" "$IMAGE_VERDICT" BLOCK_DEPLOY
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All pull-request security controls passed."

  conformance:
    # Declares what this repo IS, and which phase this run is.
    #
    # Note what is NOT claimed here: registry-scan-collect, artifact-gate and
    # gated-deploy get no `observed` entry, because they do not execute on a PR.
    # They are reported `deferred` — required by this repository, proven by the
    # delivery run — rather than a fabricated `pass`.
    needs:
      - source-security
      - image-security
      - break-glass
      - security-gate
    if: ${{ always() && github.event_name != 'schedule' }}
    uses: IamRitz/ssd-security-framework/.github/workflows/_conformance.yml@v1
    with:
      toolkit_ref: v1
      phase: pr
      artifact_type: container
      registry: ecr
      deploy_target: framework-gated
      break_glass_enabled: true
      # Strict structured break-glass evidence: a status-only record can never
      # pass. New callers always set this; it is unconditional in v2.
      strict_break_glass_evidence: true
      # PER-CONTROL evidence. Never feed `needs.source-security.result` to every
      # source control: it is the AGGREGATE, so a policy BLOCK would report all
      # three scanners as failed although they ran and produced usable reports.
      # A scanning control succeeds when its scanner produced trustworthy
      # evidence — findings included. Whether that evidence satisfies policy is
      # the source-gate control, explained by its verdict and integrity outputs.
      observed: >-
        {"secret-scan":{"status":"${{ needs.source-security.outputs.secret_scan_result }}","evidence":"Secret scanning job (per-control output)"},
         "dependency-scan":{"status":"${{ needs.source-security.outputs.dependency_scan_result }}","evidence":"Dependency scanning job (per-control output)"},
         "sast":{"status":"${{ needs.source-security.outputs.sast_result }}","evidence":"SAST job (per-control output)"},
         "source-gate":{"status":"${{ needs.source-security.outputs.source_gate_result }}","verdict":"${{ needs.source-security.outputs.verdict }}","gate_mode":"${{ needs.source-security.outputs.gate_mode }}","integrity_trusted":"${{ needs.source-security.outputs.integrity_trusted }}","break_glass_eligible":"${{ needs.source-security.outputs.break_glass_eligible }}","gate_digest":"${{ needs.source-security.outputs.gate_digest }}","override":"${{ needs.security-gate.outputs.source_override }}","evidence":"source-gate job; override claim from security-gate, verified against break-glass"},
         "image-scan-prepush":{"status":"${{ needs.image-security.result }}","verdict":"${{ needs.image-security.outputs.verdict }}","gate_mode":"${{ needs.image-security.outputs.gate_mode }}","integrity_trusted":"${{ needs.image-security.outputs.integrity_trusted }}","evidence":"pre-push Trivy gate"},
         "break-glass":{"status":"${{ needs.break-glass.result }}","decision":"${{ needs.break-glass.outputs.decision_status }}","request_delivered":"${{ needs.break-glass.outputs.request_delivered }}","gate_digest":"${{ needs.break-glass.outputs.gate_digest }}","delegated":"${{ needs.source-security.outputs.break_glass_delegated }}","evidence":"_break-glass-lambda.yml (observed decision)"}}
