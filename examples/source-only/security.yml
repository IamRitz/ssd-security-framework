# EXAMPLE CALLER — a repo that ships NO container: a library, a static site, or
# a Lambda zip built by a pipeline this framework does not own.
#
# This is the minimum viable adoption. It calls ONE reusable workflow, holds no
# cloud credentials, and needs no AWS setup at all. Break-glass is off, so an
# eligible BLOCK simply stays blocked.
#
# Note what is NOT here: no container-build, no image-security, no ECR. Those
# controls are not skipped silently — the conformance job below declares
# `artifact_type: library`, so they are reported N/A WITH A REASON.
#
# FIRST ONBOARDING: a brand-new repo has no Semgrep baseline, and the gate
# requires one. Run the bootstrap once to produce it — see
# docs/onboarding.md § "Bootstrap the first baseline". Until the baseline is
# committed, keep `gate_mode: log-only`.
name: Security checks

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'
  # ONE-TIME onboarding: dispatch with the box ticked to produce the first
  # baseline. A dispatched run scans the FULL tree; a pull_request scan is
  # diff-aware and the framework refuses to bootstrap from it.
  workflow_dispatch:
    inputs:
      bootstrap_baseline:
        description: ONE-TIME onboarding - full Semgrep scan against an empty accepted set, uploading a candidate baseline.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-security:
    # `_source-scan.yml`: the OIDC-free source workflow. This repository has no
    # break-glass, so NO job here is granted `id-token: write` — and GitHub does
    # not require it, because nothing in the called workflow can request one.
    uses: IamRitz/ssd-security-framework/.github/workflows/_source-scan.yml@v1
    permissions:
      contents: read
      pull-requests: write
    # The webhook URL is a credential: pass it as a declared SECRET (never a
    # repository variable, never `secrets: inherit`). Only the notifier step reads it.
    secrets:
      slack_notify_webhook: ${{ secrets.SECURITY_NOTIFY_SLACK_URL }}
    with:
      toolkit_ref: v1
      # START HERE on a new repo. Move to `enforce` only after you have generated
      # and committed a Semgrep baseline — see docs/onboarding.md § rollout.
      gate_mode: ${{ vars.GATE_MODE || 'log-only' }}
      # ONE-TIME: true only on a dispatched run with the box ticked. It refuses to
      # run unless gate_mode is log-only, and refuses outright if a baseline
      # already exists. Remove the dispatch input once the baseline is committed.
      bootstrap_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_baseline == true }}
      semgrep_configs: |
        p/owasp-top-ten
        p/javascript
      # `.` = the whole repository. Narrowing puts everything else OUTSIDE SAST, and
      # without a .semgrepignore Semgrep silently skips tests/, build/, vendor/ … too.
      semgrep_paths: .

  security-gate:
    # THE stable required check for branch protection.
    #
    # This repository ships no artifact, so source security IS the whole PR
    # security contract — there is no image gate to aggregate. A container repo
    # must additionally require its pre-push image gate; see
    # examples/container-ecr/security.yml.
    #
    # The name is a CONSTANT: branch protection matches by exact string, and a
    # name computed from the gate mode would stop matching in one mode.
    name: security-gate
    needs: source-security
    # `always()` so the required check still reports when the dependency fails.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every security control that gates this pull request
        env:
          # Same variable names as the container examples: the aggregate is the
          # same contract, this repo simply has one control in it.
          SOURCE_RESULT: ${{ needs.source-security.result }}
          VERDICT: ${{ needs.source-security.outputs.verdict }}
          MODE: ${{ needs.source-security.outputs.gate_mode }}
        run: |
          set -euo pipefail
          echo "source-security: result=$SOURCE_RESULT verdict=${VERDICT:-unknown}"
          if [ "$MODE" = "log-only" ]; then
            # Verdict-specific: only a BLOCK is suppressed by log-only. A PASS has
            # nothing to suppress, but log-only stays visible as a rollout mode.
            case "$VERDICT" in
              BLOCK)
                echo "::warning::GREEN BY CONFIGURATION, not by verdict — source verdict BLOCK is reported but NOT enforced because gate_mode is log-only."
                ;;
              PASS|PASS-WITH-EXCEPTIONS)
                echo "::warning::Source verdict $VERDICT. gate_mode is log-only; no blocking verdict exists, so nothing was suppressed. A future BLOCK would not fail this check until the repository moves to enforce."
                ;;
              *)
                echo "::warning::Source verdict is unavailable ('${VERDICT}'), and gate_mode is log-only so nothing is enforced. Treat this run as UNKNOWN, not clean."
                ;;
            esac
          fi
          if [ "$SOURCE_RESULT" != "success" ]; then
            echo "::error::source security did not pass (result=$SOURCE_RESULT)"
            exit 1
          fi
          echo "All pull-request security controls passed."

  conformance:
    needs: source-security
    if: ${{ always() }}
    uses: IamRitz/ssd-security-framework/.github/workflows/_conformance.yml@v1
    with:
      toolkit_ref: v1
      # A library has no delivery phase of its own, so every control it requires
      # runs here. Nothing is deferred.
      phase: pr
      artifact_type: library
      registry: none
      deploy_target: none
      break_glass_enabled: false
      # Strict structured break-glass evidence: a status-only record can never
      # pass. New callers always set this; it is unconditional in v2.
      strict_break_glass_evidence: true
      # PER-CONTROL evidence. Never feed `needs.source-security.result` to every
      # source control: it is the AGGREGATE, so a policy BLOCK would report all
      # three scanners as failed although they ran and produced usable reports.
      # A scanning control succeeds when its scanner produced trustworthy
      # evidence — findings included. Whether that evidence satisfies policy is
      # the source-gate control, explained by its verdict and integrity outputs.
      observed: >-
        {"secret-scan":{"status":"${{ needs.source-security.outputs.secret_scan_result }}","evidence":"Secret scanning job (per-control output)"},
         "dependency-scan":{"status":"${{ needs.source-security.outputs.dependency_scan_result }}","evidence":"Dependency scanning job (per-control output)"},
         "sast":{"status":"${{ needs.source-security.outputs.sast_result }}","evidence":"SAST job (per-control output)"},
         "source-gate":{"status":"${{ needs.source-security.outputs.source_gate_result }}","verdict":"${{ needs.source-security.outputs.verdict }}","gate_mode":"${{ needs.source-security.outputs.gate_mode }}","integrity_trusted":"${{ needs.source-security.outputs.integrity_trusted }}","evidence":"source-gate job"}}
