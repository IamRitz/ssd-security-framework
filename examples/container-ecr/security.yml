# EXAMPLE CALLER — PR phase for a repo that ships a container image to ECR and
# lets the framework gate its deploy.
#
# This file proves the PR-phase controls: source security and the PRE-PUSH image
# scan. The registry scan, the artifact gate and the deploy are proven by
# deploy.yml, on the delivery run. Neither file claims the other's controls.
#
# Copy this to .github/workflows/security.yml in the consumer repo and change:
#   - the image name in `container-build`
#   - `semgrep_configs` to your language pack
#   - `@v1` if you pin a different framework version
#
# TRIGGER OWNERSHIP: this file owns `pull_request` and `schedule`; deploy.yml
# owns `push` to main and `workflow_dispatch`. Neither reacts to the other's
# events, so the scanners run exactly once per event.
#
# SECURITY: keep this `pull_request` — never `pull_request_target`. The notifier
# holds `pull-requests: write`; on `pull_request` GitHub forces the token
# read-only for fork PRs, so untrusted fork code cannot write a comment or read
# the Slack URL.
name: Security checks

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  source-security:
    # NEVER change this to `secrets: inherit` — that would hand every repo secret
    # to the scanning jobs.
    uses: IamRitz/ssd-security-framework/.github/workflows/_source-security.yml@v1
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      # toolkit_ref MUST match the @v1 above. See docs/versioning.md.
      toolkit_ref: v1
      gate_mode: ${{ vars.GATE_MODE || 'enforce' }}
      semgrep_configs: |
        p/owasp-top-ten
        p/javascript
      semgrep_paths: src
      slack_notify_url: ${{ vars.SECURITY_NOTIFY_SLACK_URL }}
      break_glass_enabled: true
      break_glass_transport: lambda
      break_glass_lambda_role_arn: ${{ vars.BREAK_GLASS_LAMBDA_ROLE_ARN }}
      break_glass_lambda_function: ${{ vars.BREAK_GLASS_LAMBDA_FUNCTION }}
      break_glass_aws_region: ${{ vars.AWS_REGION }}

  container-build:
    # Repo-specific: the consumer owns its own build. Holds ZERO cloud
    # credentials — it builds the image and uploads it as a tarball artifact.
    name: Container build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build without AWS credentials
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: your-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export image tarball
        run: docker save -o application-image.tar "your-app:$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-image-${{ github.sha }}
          path: application-image.tar
          if-no-files-found: error
          retention-days: 1

  image-security:
    needs: container-build
    if: github.event_name != 'schedule'
    uses: IamRitz/ssd-security-framework/.github/workflows/_image-scan-prepush.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      toolkit_ref: v1
      image_artifact: application-image-${{ github.sha }}
      gate_mode: ${{ vars.GATE_MODE || 'enforce' }}
      slack_notify_url: ${{ vars.SECURITY_NOTIFY_SLACK_URL }}

  security-gate:
    # THE stable required check for branch protection, and it must represent
    # EVERY control that gates this PR — not just source security.
    #
    # For a container repository that means source security AND the pre-push
    # image gate. A rule requiring a source-only check would let a PR whose image
    # gate reported BLOCK_DEPLOY merge, which is not what the name promises.
    #
    # The name is a CONSTANT. Branch protection matches by exact string, so a
    # name computed from the gate mode would stop matching in one mode and the
    # rule would silently protect nothing.
    name: security-gate
    needs:
      - source-security
      - image-security
    # `always()` so this job still REPORTS when a dependency fails or is skipped.
    # Without it the job is skipped, the required check never posts, and the PR
    # waits forever on a status that will not arrive.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every security control that gates this pull request
        env:
          EVENT: ${{ github.event_name }}
          SOURCE_RESULT: ${{ needs.source-security.result }}
          IMAGE_RESULT: ${{ needs.image-security.result }}
          SOURCE_VERDICT: ${{ needs.source-security.outputs.verdict }}
          IMAGE_VERDICT: ${{ needs.image-security.outputs.verdict }}
          MODE: ${{ needs.source-security.outputs.gate_mode }}
        run: |
          set -euo pipefail
          echo "event=$EVENT"
          echo "source-security: result=$SOURCE_RESULT verdict=${SOURCE_VERDICT:-unknown}"
          echo "image-security:  result=$IMAGE_RESULT verdict=${IMAGE_VERDICT:-unknown}"

          failed=0
          if [ "$SOURCE_RESULT" != "success" ]; then
            echo "::error::source security did not pass (result=$SOURCE_RESULT)"
            failed=1
          fi

          # The scheduled sweep deliberately builds no image, so `skipped` is
          # legitimate THERE and only there. On a pull request a skipped image
          # gate means a control that should have run did not — which must fail,
          # or schedule-shaped skipping would quietly redefine the PR contract.
          if [ "$EVENT" = "schedule" ]; then
            case "$IMAGE_RESULT" in
              success|skipped) ;;
              *)
                echo "::error::image security did not pass (result=$IMAGE_RESULT)"
                failed=1
                ;;
            esac
          elif [ "$IMAGE_RESULT" != "success" ]; then
            echo "::error::image security did not pass (result=$IMAGE_RESULT); a container PR is gated on it"
            failed=1
          fi

          if [ "$MODE" = "log-only" ]; then
            echo "::warning::GREEN BY CONFIGURATION, not by verdict — gate_mode is log-only."
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All pull-request security controls passed."

  conformance:
    # Declares what this repo IS, and which phase this run is.
    #
    # Note what is NOT claimed here: registry-scan-collect, artifact-gate and
    # gated-deploy get no `observed` entry, because they do not execute on a PR.
    # They are reported `deferred` — required by this repository, proven by the
    # delivery run — rather than a fabricated `pass`.
    needs:
      - source-security
      - image-security
    if: ${{ always() && github.event_name != 'schedule' }}
    uses: IamRitz/ssd-security-framework/.github/workflows/_conformance.yml@v1
    with:
      toolkit_ref: v1
      phase: pr
      artifact_type: container
      registry: ecr
      deploy_target: framework-gated
      break_glass_enabled: true
      observed: >-
        {"secret-scan":{"status":"${{ needs.source-security.result }}","evidence":"source-security job"},
         "dependency-scan":{"status":"${{ needs.source-security.result }}","evidence":"source-security job"},
         "sast":{"status":"${{ needs.source-security.result }}","evidence":"source-security job"},
         "source-gate":{"status":"${{ needs.source-security.result }}","evidence":"security-gate check"},
         "image-scan-prepush":{"status":"${{ needs.image-security.result }}","evidence":"security-gate check"},
         "break-glass":{"status":"pass","evidence":"lambda transport configured for this repo"}}
