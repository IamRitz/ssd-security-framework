name: Framework checks

# The framework's own tests. These are the guards that keep the reusable
# workflows honest — the credential boundary, the registry neutrality, and the
# extraction itself (scripts loaded from the toolkit, toolkit moved out of the
# scanned workspace).
#
# It also runs the consumer-isolation proof, which reproduces on the runner what
# a consumer repo experiences: the toolkit somewhere else entirely, the consumer
# holding none of it.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Framework checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Toolkit and workflow tests
        run: node --test

      - name: The OIDC-free twin matches its source
        # _source-scan.yml is generated from _source-security.yml; a stale twin
        # would let the two workflows' scanner logic drift apart.
        run: node tools/render-source-scan.mjs --check

      - name: Prove a consumer needs zero framework files
        run: ./tools/verify-consumer-isolation.sh

      - name: Prove every consumer profile onboards, including from no baseline
        # Walks a brand-new library repo from NO Semgrep baseline through
        # bootstrap, generation, and a normal gate run — the deadlock that
        # blocked the first real consumer — plus the PR/delivery lifecycle split
        # for the container profiles.
        run: ./tools/verify-onboarding-profiles.sh

      - name: Prove generated consumer workflows are valid Actions (actionlint, PyYAML)
        # ssd-onboard renders every profile variant; actionlint (pinned by digest)
        # checks them and the examples independently of ssd-onboard's own parser.
        run: ./tools/verify-generated-workflows.sh

      - name: Re-verify pinned scanner behaviour the onboarding model depends on
        # Semgrep's scope with/without .semgrepignore (vs the recorded fixture)
        # and Gitleaks default-rule inheritance, run with the pinned images.
        run: node tools/verify-scanner-behaviour.mjs

      - name: Prove the onboarding tests guard their security invariants
        # Breaks each invariant (default Gitleaks rules, credential separation,
        # no silent baseline acceptance, ...) in a scratch copy; every mutation
        # must make the tests fail.
        run: node tools/mutation-check-onboarding.mjs

      - name: The toolkit must stay dependency-free
        # Every script imports only Node builtins. That is what lets the toolkit
        # be dropped into any consumer's runner with nothing installed, and it is
        # why there is no lockfile here for a consumer's OSV scan to trip over.
        # The onboarding CLI follows the same rule.
        #
        # The pattern uses a negative lookahead, so it is PCRE (-P) ONLY: passing
        # -E as well makes GNU grep exit 2 with "conflicting matchers specified",
        # and an `if grep ...` around that reads the error as "no match" and
        # PASSES. This is a security control, so the three grep outcomes are kept
        # apart and anything that is not a clean "no match" fails closed.
        run: |
          set +e
          grep -rnP \
            --include='*.mjs' \
            "^import .* from '(?!node:)[^.]" \
            security/scripts onboarding
          rc=$?
          set -e

          case "$rc" in
            0)
              echo "A toolkit or onboarding script imports a third-party module; they must use Node builtins only." >&2
              exit 1
              ;;
            1)
              echo "Toolkit and onboarding imports are Node builtins and relative paths only."
              ;;
            *)
              echo "Dependency-free import check itself failed (grep exit $rc)." >&2
              exit "$rc"
              ;;
          esac
