# EXAMPLE CALLER — a Python service that builds a container but deploys through
# a pipeline this framework does NOT own.
#
# Three things make this different from the container-ecr example:
#
#  1. `semgrep_configs` uses the Python pack. This is not cosmetic: running
#     `p/javascript` against Python reports near-zero findings, which reads as a
#     clean pass rather than a misconfiguration.
#  2. `deploy_target: self-managed` and `registry: none`. The repo genuinely has
#     a deploy, but not one this framework gates — so the registry and deploy
#     controls are N/A with that reason, rather than deferred to a delivery run
#     that never happens here.
#  3. The pre-push image gate is STILL required. The framework does not push or
#     deploy this image, but it does refuse to let a vulnerable one leave CI, so
#     `security-gate` aggregates it exactly as the fully-gated example does.
#
# Dependency scanning needs no configuration: pip-audit runs from
# requirements.txt, and OSV-Scanner covers poetry.lock / Pipfile.lock regardless.
name: Security checks

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  source-security:
    # `_source-scan.yml`: the OIDC-free source workflow. This repository has no
    # break-glass, so NO job here is granted `id-token: write` — and GitHub does
    # not require it, because nothing in the called workflow can request one.
    uses: IamRitz/ssd-security-framework/.github/workflows/_source-scan.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      toolkit_ref: v1
      gate_mode: ${{ vars.GATE_MODE || 'enforce' }}
      semgrep_configs: |
        p/owasp-top-ten
        p/python
      semgrep_paths: src
      slack_notify_url: ${{ vars.SECURITY_NOTIFY_SLACK_URL }}

  container-build:
    name: Container build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: your-python-app:${{ github.sha }}
      - run: docker save -o application-image.tar "your-python-app:$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-image-${{ github.sha }}
          path: application-image.tar
          if-no-files-found: error
          retention-days: 1

  image-security:
    # The image still gets scanned before it leaves CI, even though this
    # framework never pushes or deploys it.
    needs: container-build
    if: github.event_name != 'schedule'
    uses: IamRitz/ssd-security-framework/.github/workflows/_image-scan-prepush.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      toolkit_ref: v1
      image_artifact: application-image-${{ github.sha }}
      gate_mode: ${{ vars.GATE_MODE || 'enforce' }}

  security-gate:
    # THE stable required check. This repo ships a container, so the PR contract
    # is source security AND the pre-push image gate — even though the framework
    # owns neither the registry nor the deploy. "We deploy it ourselves" is not a
    # reason to merge a PR whose image gate reported BLOCK_DEPLOY.
    name: security-gate
    needs:
      - source-security
      - image-security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every security control that gates this pull request
        env:
          EVENT: ${{ github.event_name }}
          SOURCE_RESULT: ${{ needs.source-security.result }}
          IMAGE_RESULT: ${{ needs.image-security.result }}
          SOURCE_VERDICT: ${{ needs.source-security.outputs.verdict }}
          IMAGE_VERDICT: ${{ needs.image-security.outputs.verdict }}
          MODE: ${{ needs.source-security.outputs.gate_mode }}
          IMAGE_MODE: ${{ needs.image-security.outputs.gate_mode }}
        run: |
          set -euo pipefail
          echo "event=$EVENT source=$SOURCE_RESULT image=$IMAGE_RESULT"

          failed=0
          if [ "$SOURCE_RESULT" != "success" ]; then
            echo "::error::source security did not pass (result=$SOURCE_RESULT)"
            failed=1
          fi

          # `skipped` is legitimate only on the scheduled sweep, which builds no
          # image. On a pull request it means a required control did not run.
          if [ "$EVENT" = "schedule" ]; then
            case "$IMAGE_RESULT" in
              success|skipped) ;;
              *)
                echo "::error::image security did not pass (result=$IMAGE_RESULT)"
                failed=1
                ;;
            esac
          elif [ "$IMAGE_RESULT" != "success" ]; then
            echo "::error::image security did not pass (result=$IMAGE_RESULT); a container PR is gated on it"
            failed=1
          fi

          # Verdict-specific log-only reporting, per control: only a blocking
          # verdict is suppressed by log-only. A PASS/DEPLOY has nothing to
          # suppress, but log-only stays visible as a rollout mode.
          report_log_only() {
            local control="$1" mode="$2" verdict="$3" blocking="$4"
            [ "$mode" = "log-only" ] || return 0
            if [ "$verdict" = "$blocking" ]; then
              echo "::warning::GREEN BY CONFIGURATION, not by verdict — $control verdict $verdict is reported but NOT enforced because gate_mode is log-only."
            elif [ -n "$verdict" ]; then
              echo "::warning::$control verdict $verdict. gate_mode is log-only; no blocking verdict exists, so nothing was suppressed. A future $blocking would not fail this check until the repository moves to enforce."
            else
              echo "::warning::$control verdict is unavailable, and gate_mode is log-only so nothing is enforced. Treat it as UNKNOWN, not clean."
            fi
          }
          report_log_only "source" "$MODE" "$SOURCE_VERDICT" BLOCK
          if [ "$IMAGE_RESULT" != "skipped" ]; then
            report_log_only "image" "$IMAGE_MODE" "$IMAGE_VERDICT" BLOCK_DEPLOY
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All pull-request security controls passed."

  conformance:
    needs:
      - source-security
      - image-security
    if: ${{ always() && github.event_name != 'schedule' }}
    uses: IamRitz/ssd-security-framework/.github/workflows/_conformance.yml@v1
    with:
      toolkit_ref: v1
      # Every control this repository requires runs in this phase: the registry
      # and deploy controls are N/A (not this framework's), not deferred.
      phase: pr
      artifact_type: container
      registry: none
      deploy_target: self-managed
      break_glass_enabled: false
      # Strict structured break-glass evidence: a status-only record can never
      # pass. New callers always set this; it is unconditional in v2.
      strict_break_glass_evidence: true
      # PER-CONTROL evidence. Never feed `needs.source-security.result` to every
      # source control: it is the AGGREGATE, so a policy BLOCK would report all
      # three scanners as failed although they ran and produced usable reports.
      # A scanning control succeeds when its scanner produced trustworthy
      # evidence — findings included. Whether that evidence satisfies policy is
      # the source-gate control, explained by its verdict and integrity outputs.
      observed: >-
        {"secret-scan":{"status":"${{ needs.source-security.outputs.secret_scan_result }}","evidence":"Secret scanning job (per-control output)"},
         "dependency-scan":{"status":"${{ needs.source-security.outputs.dependency_scan_result }}","evidence":"Dependency scanning job (per-control output)"},
         "sast":{"status":"${{ needs.source-security.outputs.sast_result }}","evidence":"SAST job (per-control output)"},
         "source-gate":{"status":"${{ needs.source-security.outputs.source_gate_result }}","verdict":"${{ needs.source-security.outputs.verdict }}","gate_mode":"${{ needs.source-security.outputs.gate_mode }}","integrity_trusted":"${{ needs.source-security.outputs.integrity_trusted }}","evidence":"source-gate job"},
         "image-scan-prepush":{"status":"${{ needs.image-security.result }}","verdict":"${{ needs.image-security.outputs.verdict }}","gate_mode":"${{ needs.image-security.outputs.gate_mode }}","integrity_trusted":"${{ needs.image-security.outputs.integrity_trusted }}","evidence":"pre-push Trivy gate"}}
